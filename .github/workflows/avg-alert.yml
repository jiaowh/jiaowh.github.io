name: BTC and MSTR strategy alerts

# Fast iMACD 14/21/34, signal 13, >50% early buyback. Signals only; no orders.
# Daily breadth at 00:00 UTC (08:00 Singapore), plus every modeled BUY/SELL.
# Secrets: TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID. No weekly/startup/error messages.
on:
  schedule:
    - cron: "7 0,4,8,12,16,20 * * *"
    # MSTR daily opening, covering both US daylight and standard time.
    - cron: "37 13,14 * * 1-5"
    - cron: "7 21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: avg-alert
  cancel-in-progress: false

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            btc.html
            .github/scripts
            assets/btc/signal-snapshot.json
            assets/btc/fast-strategy.mjs
            assets/btc/mstr-strategy.mjs
            assets/btc/mstr-snapshot.json
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Versioned model state, unsent messages and verified candle history.
      - uses: actions/cache/restore@v4
        with:
          path: .alert-state
          key: btc-fast-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: btc-fast-v1-

      - name: BTC daily breadth and trades
        id: btc
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node .github/scripts/avg_alert.mjs

      - name: MSTR daily breadth and trades
        id: mstr
        if: ${{ !cancelled() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node .github/scripts/mstr_alert.mjs

      - name: Publish verified MSTR candles for the chart
        if: ${{ !cancelled() && steps.mstr.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add assets/btc/mstr-snapshot.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh MSTR strategy candles'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
          # A GITHUB_TOKEN push does not trigger the legacy Pages build automatically.
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .alert-state
          key: btc-fast-v1-${{ github.run_id }}-${{ github.run_attempt }}
