name: BTC fast iMACD alerts

# Fast iMACD 14/21/34, signal 13, >50% early buyback. Signals only; no orders.
# Daily breadth at 00:00 UTC (08:00 Singapore), plus every modeled BUY/SELL.
# Secrets: TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID. No weekly/startup/error messages.
on:
  schedule:
    - cron: "7 0,4,8,12,16,20 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: avg-alert
  cancel-in-progress: false

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            btc.html
            .github/scripts
            assets/btc/signal-snapshot.json
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Versioned model state, unsent messages and verified candle history.
      - uses: actions/cache/restore@v4
        with:
          path: .alert-state
          key: btc-fast-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: btc-fast-v1-

      - name: Check and notify
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node .github/scripts/avg_alert.mjs

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .alert-state
          key: btc-fast-v1-${{ github.run_id }}-${{ github.run_attempt }}
