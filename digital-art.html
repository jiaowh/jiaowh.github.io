<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e7dcbf">
<title>NAHNEW — 絵 · The Turning Gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Spectral:ital,wght@0,300;0,400;0,500;1,400&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --parch:#e7dcbf; --parch2:#e9dec0; --parch3:#e5d8b4;
    --ink:#160f06; --dim:#7a6a4c; --body:#4a3d28;
    --red:#b1402f; --teal:#2f7d80;
    --cur-star: url('data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2222%22%20height%3D%2222%22%3E%3Cpath%20d%3D%22M11%202%20L12.6%209.4%20L20%2011%20L12.6%2012.6%20L11%2020%20L9.4%2012.6%20L2%2011%20L9.4%209.4%20Z%22%20fill%3D%22%23160f06%22%20fill-opacity%3D%220.66%22%2F%3E%3C%2Fsvg%3E') 11 11, auto;
    --cur-point: url('data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2230%22%20height%3D%2230%22%3E%3Cpath%20d%3D%22M15%202%20L18%2012%20L28%2015%20L18%2018%20L15%2028%20L12%2018%20L2%2015%20L12%2012%20Z%22%20fill%3D%22%232f7d80%22%20stroke%3D%22white%22%20stroke-width%3D%221.4%22%20stroke-linejoin%3D%22round%22%2F%3E%3C%2Fsvg%3E') 15 15, pointer;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;background:var(--parch);}
  body{color:var(--ink);font-family:'Spectral',serif;cursor:var(--cur-star);overflow:hidden;}
  button{font:inherit;cursor:var(--cur-point);}
  a{cursor:var(--cur-point);}
  img{-webkit-user-drag:none;user-select:none;}

  /* ---------- shared chrome ---------- */
  .grain{position:fixed;inset:0;z-index:60;pointer-events:none;mix-blend-mode:multiply;opacity:.16;
    background-image:url('data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20width=%22180%22%20height=%22180%22%3E%3Cfilter%20id=%22n%22%3E%3CfeTurbulence%20type=%22fractalNoise%22%20baseFrequency=%220.8%22%20numOctaves=%222%22%20stitchTiles=%22stitch%22/%3E%3C/filter%3E%3Crect%20width=%22100%25%22%20height=%22100%25%22%20filter=%22url%28%23n%29%22/%3E%3C/svg%3E');background-size:180px 180px;}
  .vignette{position:fixed;inset:0;z-index:55;pointer-events:none;background:radial-gradient(120% 95% at 50% 38%, transparent 55%, rgba(70,50,22,.22));}

  nav.sitenav{display:flex;align-items:center;justify-content:space-between;padding:22px 40px 15px;border-bottom:1.5px solid var(--ink);position:relative;z-index:20;background:var(--parch);}
  .brand{display:flex;align-items:center;gap:11px;text-decoration:none;color:var(--ink);}
  .brand .star{color:var(--red);font-size:24px;line-height:1;}
  .brand b{font-family:'Cinzel',serif;font-weight:700;font-size:18px;letter-spacing:.18em;}
  .navlinks{display:flex;align-items:center;gap:16px;font:400 12px/1 'Courier Prime',monospace;letter-spacing:.12em;text-transform:uppercase;color:#5b4d35;}
  .navlinks a{color:inherit;text-decoration:none;}
  .navlinks a:hover{color:var(--red);}
  .navlinks a[aria-current]{color:var(--teal);border-bottom:1.5px dashed var(--teal);padding-bottom:2px;}
  .navlinks .dot{color:var(--red);font-size:9px;}
  #hamb{display:none;flex-direction:column;align-items:center;justify-content:center;gap:4px;width:42px;height:42px;padding:0;background:var(--ink);border:1.5px solid #000;border-radius:2px;box-shadow:3px 3px 0 rgba(47,125,128,.55);}
  #hamb span{display:block;width:18px;height:2px;background:#f4ecd6;}
  #navmenu{display:none;position:absolute;top:calc(100% + 7px);right:18px;z-index:70;width:236px;max-height:0;opacity:0;overflow:hidden;transition:max-height .42s cubic-bezier(.2,.7,.2,1),opacity .3s ease;background:var(--parch2);border:1.5px solid #000;border-radius:2px;box-shadow:6px 8px 0 rgba(42,32,20,.28);}
  #navmenu .col{display:flex;flex-direction:column;padding:6px;font:400 13px/1 'Courier Prime',monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--ink);}
  #navmenu a{display:flex;align-items:center;gap:11px;padding:12px;color:inherit;text-decoration:none;border-bottom:1px dashed rgba(22,15,6,.22);}
  #navmenu a:last-child{border-bottom:0;}
  #navmenu .dot{color:var(--red);font-size:10px;}

  /* ---------- the wheel stage ---------- */
  #stage{position:relative;height:calc(100vh - 81px);height:calc(100dvh - 81px);min-height:520px;overflow:hidden;touch-action:none;}
  .stage-eyebrow{position:absolute;top:22px;left:40px;z-index:5;display:flex;align-items:center;gap:10px;font:400 12px/1 'Courier Prime',monospace;letter-spacing:.2em;text-transform:uppercase;color:var(--teal);pointer-events:none;}
  .stage-eyebrow .s{font-size:11px;}
  #ghostkanji{position:absolute;right:2vw;top:50%;transform:translateY(-54%);z-index:1;font-family:'Cinzel',serif;font-weight:700;font-size:clamp(200px,34vh,340px);line-height:1;color:rgba(22,15,6,.05);pointer-events:none;writing-mode:vertical-rl;letter-spacing:.1em;}

  /* info panel — left */
  #panel{position:absolute;left:40px;top:50%;transform:translateY(-50%);z-index:8;width:min(330px,26vw);pointer-events:none;}
  #panel > *{pointer-events:auto;}
  #panel::before{content:'';position:absolute;z-index:-1;inset:-90px -140px -90px -140px;pointer-events:none;
    background:radial-gradient(ellipse 62% 56% at 42% 50%, rgba(231,220,191,.97) 36%, rgba(231,220,191,.8) 56%, rgba(231,220,191,0) 76%);}
  @keyframes swapin{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
  #p-no{font:400 12px/1 'Courier Prime',monospace;letter-spacing:.22em;color:var(--dim);display:flex;align-items:center;gap:12px;}
  #p-no .rule{flex:1;height:1px;background:rgba(22,15,6,.3);}
  #p-title{margin:14px 0 0;font-family:'Cinzel',serif;font-weight:700;font-size:clamp(30px,3.4vw,50px);line-height:1.06;letter-spacing:-.005em;color:var(--ink);text-shadow:1.5px 0 rgba(177,64,47,.14),-1.5px 0 rgba(47,125,128,.14);}
  #p-jp{margin-top:10px;font:400 13px/1 'Courier Prime',monospace;letter-spacing:.3em;color:var(--red);}
  #p-cls{display:inline-block;margin-top:16px;font:700 10px/1 'Courier Prime',monospace;letter-spacing:.18em;text-transform:uppercase;color:var(--teal);border:1.5px solid var(--teal);padding:6px 10px;border-radius:2px;background:rgba(47,125,128,.06);}
  #p-desc{margin:16px 0 0;font-style:italic;font-size:15px;line-height:1.55;font-weight:300;color:var(--body);max-width:34ch;min-height:3.1em;}
  #p-open{display:inline-flex;align-items:center;gap:10px;margin-top:22px;padding:13px 22px;border:0;border-radius:2px;font:700 11px/1 'Courier Prime',monospace;letter-spacing:.14em;text-transform:uppercase;color:#f4ecd6;background:var(--ink);box-shadow:3px 3px 0 rgba(47,125,128,.65);transition:transform .25s,box-shadow .25s;}
  #p-open:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 rgba(47,125,128,.9);}
  #panel .swap{animation:swapin .45s cubic-bezier(.2,.7,.2,1) both;}

  /* ring */
  #wheelwrap{position:absolute;inset:0;z-index:4;}
  #ring{position:absolute;left:50%;top:50%;transform-style:preserve-3d;will-change:transform;}
  .wcard{position:absolute;left:0;top:0;transform-style:preserve-3d;}
  .wface,.wback{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:2px;border:1.5px solid #000;}
  .wface{padding:5px;background:repeating-linear-gradient(45deg, rgba(50,30,10,.06) 0 1px, transparent 1px 5px),#ab9462;box-shadow:0 14px 26px -14px rgba(40,30,16,.6), inset 0 0 22px rgba(44,26,8,.35);display:flex;}
  .wface .mat{flex:1;border:1px solid #000;background:var(--parch2);padding:7px 7px 6px;display:flex;flex-direction:column;gap:6px;min-width:0;}
  .wface .win{position:relative;flex:1;border:1px solid var(--ink);overflow:hidden;background:var(--parch3);}
  .wface .win img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;}
  .wface .cap{display:flex;align-items:center;justify-content:space-between;gap:8px;font:400 9px/1 'Courier Prime',monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);}
  .wface .cap b{font-family:'Cinzel',serif;font-weight:700;font-size:11px;letter-spacing:.02em;color:var(--ink);text-transform:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .wface .badge{position:absolute;top:10px;right:10px;z-index:2;font:700 8px/1 'Courier Prime',monospace;letter-spacing:.1em;color:#f4ecd6;background:var(--ink);padding:3px 5px;border-radius:2px;}
  .wback{transform:rotateY(180deg);background:repeating-linear-gradient(45deg, rgba(50,30,10,.09) 0 1px, transparent 1px 5px),#ab9462;box-shadow:inset 0 0 30px rgba(44,26,8,.45);display:grid;place-items:center;}
  .wback .bb{position:absolute;inset:7px;border:1px solid rgba(0,0,0,.55);}
  .wback .seal{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:24px;font-weight:700;color:#fff;background:radial-gradient(circle at 34% 26%, #4f9ea1, #2f7d80 52%, #123637);border:2px solid #f4ecd6;box-shadow:0 0 0 1.5px #000;text-shadow:0 1px 1px rgba(0,0,0,.6);}
  .wcard .lift{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,.7,.2,1),filter .45s ease;filter:saturate(.72) brightness(.93);}
  .wcard.is-front .lift{transform:translateZ(46px) scale(1.045);filter:saturate(1.04) brightness(1);}
  .wcard.is-front .wface{box-shadow:0 22px 40px -18px rgba(40,30,16,.7), inset 0 0 22px rgba(44,26,8,.3);}
  .wcard:not(.is-front):hover .lift{filter:saturate(.95) brightness(.98);}

  /* wheel footer controls */
  .wctl{position:absolute;bottom:26px;z-index:8;font:700 12px/1 'Courier Prime',monospace;letter-spacing:.2em;text-transform:uppercase;color:var(--ink);background:none;border:0;padding:10px 2px;}
  .wctl:hover{color:var(--red);}
  .wctl .ar{color:var(--red);}
  #btnprev{left:40px;}
  #btnnext{right:40px;}
  #scrollhint{position:absolute;left:50%;bottom:30px;transform:translateX(-50%);z-index:7;font:400 10px/1 'Courier Prime',monospace;letter-spacing:.26em;text-transform:uppercase;color:var(--dim);pointer-events:none;display:flex;align-items:center;gap:10px;}
  @keyframes hintbob{0%,100%{transform:translateY(0);}50%{transform:translateY(4px);}}
  #scrollhint .v{animation:hintbob 1.8s ease-in-out infinite;color:var(--teal);}
  #scrollhint{white-space:nowrap;}
  #scrollhint .mob{display:none;}

  /* ---------- detail overlay ---------- */
  #detail{position:fixed;inset:0;z-index:50;background:var(--parch);overflow-y:auto;overscroll-behavior:contain;opacity:0;visibility:hidden;transition:opacity .45s ease,visibility 0s linear .45s;}
  #detail.on{opacity:1;visibility:visible;transition:opacity .45s ease;}
  #detail .dwrap{position:relative;max-width:1280px;margin:0 auto;padding:0 40px;display:grid;grid-template-columns:330px 1fr;gap:56px;}
  #detail .dvig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(120% 95% at 50% 38%, transparent 55%, rgba(70,50,22,.2));}

  #dclose{position:fixed;top:22px;right:36px;z-index:54;display:flex;align-items:center;gap:10px;padding:12px 18px;border:1.5px solid #000;border-radius:2px;background:var(--parch2);font:700 11px/1 'Courier Prime',monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--ink);box-shadow:3px 3px 0 rgba(42,32,20,.3);transition:transform .2s,box-shadow .2s;}
  #dclose:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 rgba(177,64,47,.6);}
  #dclose .x{color:var(--red);font-size:13px;}

  #dmeta{position:sticky;top:0;align-self:start;height:100dvh;display:flex;flex-direction:column;justify-content:center;gap:0;padding:80px 0 40px;}
  #dm-no{font:400 12px/1 'Courier Prime',monospace;letter-spacing:.22em;color:var(--dim);display:flex;align-items:center;gap:12px;}
  #dm-no .rule{flex:1;height:1px;background:rgba(22,15,6,.3);}
  #dm-title{margin:16px 0 0;font-family:'Cinzel',serif;font-weight:700;font-size:clamp(30px,3vw,44px);line-height:1.08;color:var(--ink);text-shadow:1.5px 0 rgba(177,64,47,.14),-1.5px 0 rgba(47,125,128,.14);}
  #dm-jp{margin-top:10px;font:400 13px/1 'Courier Prime',monospace;letter-spacing:.3em;color:var(--red);}
  #dm-desc{margin:18px 0 0;font-style:italic;font-size:15.5px;line-height:1.6;font-weight:300;color:var(--body);}
  .dm-table{margin-top:22px;border-top:1.5px solid var(--ink);}
  .dm-row{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px dashed rgba(22,15,6,.3);font:400 10.5px/1.4 'Courier Prime',monospace;letter-spacing:.12em;text-transform:uppercase;}
  .dm-row .k{color:var(--dim);}
  .dm-row .v{color:var(--ink);text-align:right;}
  #dm-counter{margin-top:24px;font:700 13px/1 'Courier Prime',monospace;letter-spacing:.22em;color:var(--teal);}
  #dm-counter .lbl{display:block;font-weight:400;font-size:9px;letter-spacing:.26em;color:var(--dim);margin-bottom:7px;}
  .dm-nav{display:flex;justify-content:space-between;gap:10px;margin-top:26px;font:700 11px/1 'Courier Prime',monospace;letter-spacing:.14em;text-transform:uppercase;}
  .dm-nav button{background:none;border:0;padding:8px 0;color:var(--ink);letter-spacing:inherit;font:inherit;}
  .dm-nav button:hover{color:var(--red);}
  .dm-nav .ar{color:var(--red);}

  #dplates{padding:96px 0 140px;display:flex;flex-direction:column;gap:64px;min-height:100dvh;}
  .plate{align-self:center;width:100%;max-width:720px;transform:rotate(var(--tilt,0deg));}
  .plate .pframe{border:1.5px solid #000;border-radius:2px;padding:6px;background:repeating-linear-gradient(45deg, rgba(50,30,10,.06) 0 1px, transparent 1px 5px),#ab9462;box-shadow:0 18px 34px -16px rgba(40,30,16,.55), inset 0 0 26px rgba(44,26,8,.3);}
  .plate .pmat{border:1px solid #000;background:var(--parch2);padding:10px;}
  .plate .pwin{border:1px solid var(--ink);overflow:hidden;background:var(--parch3);}
  .plate img{display:block;width:100%;height:auto;}
  .plate .pcap{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:10px 2px 2px;font:400 10px/1.5 'Courier Prime',monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);}
  .plate .pcap b{color:var(--ink);font-weight:700;}
  .plate .pcap i{font-family:'Spectral',serif;font-style:italic;text-transform:none;letter-spacing:0;font-size:13px;color:var(--body);}
  @keyframes platein{from{opacity:0;transform:rotate(var(--tilt,0deg)) translateY(46px);}to{opacity:1;transform:rotate(var(--tilt,0deg)) translateY(0);}}
  .plate.rise{animation:platein .7s cubic-bezier(.2,.7,.2,1) both;}
  #dend{align-self:center;display:flex;flex-direction:column;align-items:center;gap:18px;padding-top:10px;}
  #dend .fin{font:400 11px/1 'Courier Prime',monospace;letter-spacing:.3em;text-transform:uppercase;color:var(--dim);}
  #dend .star{color:var(--red);font-size:18px;}
  #dnextbig{background:none;border:1.5px dashed rgba(22,15,6,.4);border-radius:2px;padding:16px 30px;font:700 12px/1 'Courier Prime',monospace;letter-spacing:.18em;text-transform:uppercase;color:var(--ink);transition:border-color .25s,color .25s;}
  #dnextbig:hover{border-color:var(--red);color:var(--red);}

  /* ---------- responsive ---------- */
  @media (max-width:1080px){
    #panel{width:min(300px,30vw);}
    #detail .dwrap{grid-template-columns:280px 1fr;gap:36px;}
  }
  @media (max-width:860px){
    nav.sitenav{padding:14px 18px 12px;}
    .navlinks{display:none;}
    #hamb{display:flex;}
    #stage{height:calc(100dvh - 69px);min-height:480px;touch-action:none;}
    .stage-eyebrow{top:14px;left:18px;letter-spacing:.14em;font-size:10px;}
    #ghostkanji{display:none;}
    #panel{left:18px;right:18px;top:auto;bottom:86px;transform:none;width:auto;z-index:9;}
    #p-title{font-size:clamp(26px,7.4vw,34px);margin-top:8px;}
    #p-desc{display:none;}
    #p-jp{margin-top:6px;}
    #p-cls{margin-top:10px;padding:5px 8px;}
    #p-open{margin-top:0;position:absolute;right:0;bottom:0;}
    #btnprev{left:18px;bottom:18px;}
    #btnnext{right:18px;bottom:18px;}
    #scrollhint{bottom:31px;}
    #scrollhint .desk{display:none;}
    #scrollhint .mob{display:inline;}
    #panel::before{display:none;}
    #dclose{top:auto;bottom:18px;right:18px;}
    #detail .dwrap{display:block;padding:0 18px;}
    #dmeta{position:static;height:auto;padding:86px 0 8px;justify-content:flex-start;}
    #dm-counter{position:sticky;top:0;z-index:53;margin:18px -18px 0;padding:12px 18px;background:rgba(231,220,191,.93);backdrop-filter:blur(5px);border-bottom:1px dashed rgba(22,15,6,.3);}
    #dplates{padding:34px 0 130px;gap:40px;}
    .dm-nav{display:none;}
  }
  @media (prefers-reduced-motion:reduce){
    #scrollhint .v{animation:none;}
    #panel .swap,.plate.rise{animation:none;}
  }
</style>
</head>

<!-- ================= THE TURNING GALLERY ================= -->
<section id="stage" aria-label="Illustration wheel">
  <div class="stage-eyebrow"><span class="s">✦</span>The Turning Gallery</div>
  <div id="ghostkanji" aria-hidden="true">絵巻物</div>

  <div id="wheelwrap"><div id="ring"></div></div>

  <div id="panel" aria-live="polite">
    <div id="p-no"><span id="p-no-txt">NO. 01 / 26</span><span class="rule"></span></div>
    <h1 id="p-title">—</h1>
    <div id="p-jp">—</div>
    <div><span id="p-cls">—</span></div>
    <p id="p-desc">—</p>
    <button id="p-open">Open the card <span aria-hidden="true">↵</span></button>
  </div>

  <button class="wctl" id="btnprev" aria-label="Previous work"><span class="ar">←</span> Prev</button>
  <button class="wctl" id="btnnext" aria-label="Next work">Next <span class="ar">→</span></button>
  <div id="scrollhint"><span class="desk">scroll to turn the wheel</span><span class="mob">swipe to turn</span><span class="v">✦</span></div>
</section>

<!-- ================= EXPANDED CARD ================= -->
<div id="detail" role="dialog" aria-modal="true" aria-labelledby="dm-title">
  <div class="dvig"></div>
  <button id="dclose"><span class="x">✕</span> Close</button>
  <div class="dwrap">
    <aside id="dmeta">
      <div id="dm-no"><span id="dm-no-txt">NO. 01 / 26</span><span class="rule"></span></div>
      <h2 id="dm-title">—</h2>
      <div id="dm-jp">—</div>
      <p id="dm-desc">—</p>
      <div class="dm-table" id="dm-table"></div>
      <div id="dm-counter"><span class="lbl">now viewing</span><span id="dm-counter-txt">plate 01 / 01</span></div>
      <div class="dm-nav">
        <button id="dprev"><span class="ar">←</span> Prev card</button>
        <button id="dnext">Next card <span class="ar">→</span></button>
      </div>
    </aside>
    <div id="dplates"></div>
  </div>
</div>

<script>
'use strict';
const $ = s => document.querySelector(s);

/* ============ catalogue — newest first ============ */

];

const N = WORKS.length;
const STEP = 360 / N;
const THUMB = s => `assets/illust/web/thumb/${s}.webp`;
const LARGE = w => w.anim ? `assets/illust/web/large/${w.slug}.gif` : `assets/illust/web/large/${w.slug}.webp`;

/* ============ build the wheel ============ */
const ring = $('#ring');
const cards = [];
WORKS.forEach((w, i) => {
  const el = document.createElement('div');
  el.className = 'wcard';
  el.dataset.i = i;
  const jit = ((i * 137) % 7 - 3) * 0.55;           // deterministic hand-placed tilt
  el.innerHTML = `
    <div class="lift" style="transform-style:preserve-3d;">
      <div class="wface" style="transform:rotate(${jit}deg);">
        ${w.anim ? '<span class="badge">ANIM</span>' : ''}${w.steps ? '<span class="badge">' + w.steps + ' PLATES</span>' : ''}
        <div class="mat">
          <div class="win"><img src="${THUMB(w.slug)}" alt="${w.t}" decoding="async" ${i > 8 && i < N - 3 ? 'loading="lazy"' : ''}></div>
          <div class="cap"><b>${w.t}</b><span>no.${String(i+1).padStart(2,'0')}</span></div>
        </div>
      </div>
      <div class="wback" style="transform:rotateY(180deg) rotate(${-jit}deg);"><span class="bb"></span><span class="seal">絵</span></div>
    </div>`;
  el.addEventListener('click', () => {
    if (i === frontIdx() && Math.abs(shortest(target - cur)) < 2) openDetail(i);
    else rotateTo(i);
  });
  ring.appendChild(el);
  cards.push(el);
});

/* geometry */
let R = 900, cardH = 340;
function layout() {
  const vw = innerWidth, vh = $('#stage').clientHeight;
  const mobile = vw <= 860;
  cardH = mobile ? Math.min(240, vh * 0.34) : Math.min(360, vh * 0.44);
  const maxW = mobile ? 210 : 320;
  const slot = (mobile ? 1.28 : 1.22) * maxW;
  R = slot / (2 * Math.tan(Math.PI / N));
  $('#wheelwrap').style.perspective = Math.round(Math.max(1100, R * 1.15)) + 'px';
  $('#wheelwrap').style.perspectiveOrigin = mobile ? '50% 42%' : '58% 50%';
  ring.style.top = mobile ? '40%' : '50%';
  ring.style.left = mobile ? '50%' : '58%';
  WORKS.forEach((w, i) => {
    const h = w.ar > 1.1 ? cardH * 0.78 : cardH;
    const cw = Math.min(maxW, h * w.ar + 30);
    const ch = (cw - 30) / w.ar + 46;
    const el = cards[i];
    el.style.width = cw + 'px';
    el.style.height = ch + 'px';
    el.style.margin = `${-ch/2}px 0 0 ${-cw/2}px`;
    el.style.transform = `rotateY(${i * STEP}deg) translateZ(${R}px)`;
  });
  render();
}

/* rotation state */
let cur = -STEP * 2.6;   // start slightly turned; eases onto card 01
let target = 0;
let raf = null, snapTimer = null, lastFront = -1;

const mod = (a, n) => ((a % n) + n) % n;
const shortest = d => mod(d + 180, 360) - 180;
const frontIdx = () => mod(Math.round(target / STEP), N);

function render() {
  ring.style.transform = `translateZ(${-R}px) rotateY(${-cur}deg)`;
  const f = mod(Math.round(cur / STEP), N);
  if (f !== lastFront) {
    lastFront = f;
    cards.forEach((c, i) => c.classList.toggle('is-front', i === f));
    updatePanel(f);
  }
}
function tick() {
  const d = shortest(target - cur);
  if (Math.abs(d) < 0.02) { cur += d; render(); raf = null; return; }
  cur += d * 0.09;
  render();
  raf = requestAnimationFrame(tick);
}
function kick() { if (!raf) raf = requestAnimationFrame(tick); }
function snapSoon(ms) {
  clearTimeout(snapTimer);
  snapTimer = setTimeout(() => { target = Math.round(target / STEP) * STEP; kick(); }, ms);
}
function rotateTo(i) {
  target += shortest(i * STEP - target);
  clearTimeout(snapTimer); kick();
}

/* input: wheel */
$('#stage').addEventListener('wheel', e => {
  e.preventDefault();
  target += Math.max(-40, Math.min(40, e.deltaY * 0.045));
  kick(); snapSoon(140);
}, {passive: false});

/* input: drag / swipe */
let dragging = false, px = 0, moved = 0;
$('#stage').addEventListener('pointerdown', e => {
  if (e.target.closest('button') || e.target.closest('#panel')) return;
  dragging = true; px = e.clientX; moved = 0;
});
addEventListener('pointermove', e => {
  if (!dragging) return;
  const dx = e.clientX - px; px = e.clientX; moved += Math.abs(dx);
  target -= dx * (360 / (R * 6.28)) * 2.2;
  kick(); snapSoon(160);
});
addEventListener('pointerup', () => { dragging = false; });
/* suppress accidental card-click after a real drag */
ring.addEventListener('click', e => { if (moved > 8) { e.stopPropagation(); } }, true);

/* input: buttons & keys */
$('#btnprev').addEventListener('click', () => { target -= STEP; clearTimeout(snapTimer); kick(); });
$('#btnnext').addEventListener('click', () => { target += STEP; clearTimeout(snapTimer); kick(); });
addEventListener('keydown', e => {
  if ($('#detail').classList.contains('on')) {
    if (e.key === 'Escape') closeDetail();
    return;
  }
  if (e.key === 'ArrowLeft')  { target -= STEP; clearTimeout(snapTimer); kick(); }
  if (e.key === 'ArrowRight') { target += STEP; clearTimeout(snapTimer); kick(); }
  if (e.key === 'Enter')      openDetail(frontIdx());
});

/* left panel */
function updatePanel(i) {
  const w = WORKS[i];
  $('#p-no-txt').textContent = `NO. ${String(i+1).padStart(2,'0')} / ${N}`;
  $('#p-title').textContent = w.t;
  $('#p-jp').textContent = w.jp;
  $('#p-cls').textContent = w.cls + (w.steps ? ` · ${w.steps} plates` : '') + (w.anim ? ' · loop' : '');
  $('#p-desc').textContent = w.desc;
  ['#p-title','#p-jp','#p-desc'].forEach(s => {
    const el = $(s); el.classList.remove('swap'); void el.offsetWidth; el.classList.add('swap');
  });
}
$('#p-open').addEventListener('click', () => openDetail(frontIdx()));

/* ============ detail overlay ============ */
let curDetail = -1, plateObserver = null;

function plateSrcs(w) {
  if (w.steps) return Array.from({length: w.steps}, (_, k) =>
    ({src: `assets/illust/web/large/${w.slug}-${String(k+1).padStart(2,'0')}.webp`,
      no: `plate ${String(k+1).padStart(2,'0')}`, note: w.notes ? w.notes[k] : ''}));
  return [{src: LARGE(w), no: 'plate 01', note: ''}];
}

function openDetail(i) {
  curDetail = i;
  const w = WORKS[i];
  $('#dm-no-txt').textContent = `NO. ${String(i+1).padStart(2,'0')} / ${N}`;
  $('#dm-title').textContent = w.t;
  $('#dm-jp').textContent = w.jp;
  $('#dm-desc').textContent = w.desc;
  const plates = plateSrcs(w);
  $('#dm-table').innerHTML = [
    ['class', w.cls],
    ['plates', String(plates.length).padStart(2,'0')],
    ['format', w.anim ? 'animated · gif' : 'digital · still'],
    ['wheel', `card ${String(i+1).padStart(2,'0')} of ${N}`],
  ].map(r => `<div class="dm-row"><span class="k">${r[0]}</span><span class="v">${r[1]}</span></div>`).join('');

  const host = $('#dplates');
  host.innerHTML = '';
  plates.forEach((p, k) => {
    const d = document.createElement('figure');
    d.className = 'plate rise';
    d.style.setProperty('--tilt', `${(k % 2 ? 1 : -1) * (0.5 + (k * 53 % 5) * 0.16)}deg`);
    d.style.animationDelay = `${Math.min(k, 3) * 0.09}s`;
    d.dataset.k = k;
    d.style.margin = 0;
    const cap = w.steps
      ? `<b>step ${String(k+1).padStart(2,'0')} / ${plates.length}</b><i>${p.note}</i>`
      : `<b>${w.t}</b><span>${w.jp}</span>`;
    d.innerHTML = `<div class="pframe"><div class="pmat">
        <div class="pwin"><img src="${p.src}" alt="${w.t} — ${p.no}" decoding="async" ${k > 1 ? 'loading="lazy"' : ''}></div>
        <div class="pcap">${cap}</div>
      </div></div>`;
    host.appendChild(d);
  });
  const end = document.createElement('div');
  end.id = 'dend';
  end.innerHTML = `<span class="star">✦</span><span class="fin">end of ${w.steps ? 'the process' : 'this card'}</span>
    <button id="dnextbig">Next card — ${WORKS[(i+1)%N].t} →</button>`;
  host.appendChild(end);
  end.querySelector('#dnextbig').addEventListener('click', () => openDetail((i+1)%N));

  const total = plates.length;
  $('#dm-counter-txt').textContent = `plate 01 / ${String(total).padStart(2,'0')}`;
  if (plateObserver) plateObserver.disconnect();
  plateObserver = new IntersectionObserver(es => {
    es.forEach(en => {
      if (en.isIntersecting)
        $('#dm-counter-txt').textContent = `plate ${String(+en.target.dataset.k + 1).padStart(2,'0')} / ${String(total).padStart(2,'0')}`;
    });
  }, {root: $('#detail'), rootMargin: '-45% 0px -45% 0px'});
  host.querySelectorAll('.plate').forEach(p => plateObserver.observe(p));

  $('#detail').classList.add('on');
  $('#detail').scrollTop = 0;
  document.body.style.overflow = 'hidden';
  rotateTo(i);
}
function closeDetail() {
  $('#detail').classList.remove('on');
  curDetail = -1;
  if (plateObserver) plateObserver.disconnect();
}
$('#dclose').addEventListener('click', closeDetail);
$('#dprev').addEventListener('click', () => openDetail(mod(curDetail - 1, N)));
$('#dnext').addEventListener('click', () => openDetail(mod(curDetail + 1, N)));

/* hamburger */
$('#hamb').addEventListener('click', () => {
  const m = $('#navmenu'); const open = m.dataset.open === '1';
  m.style.display = 'block';
  requestAnimationFrame(() => {
    m.style.maxHeight = open ? '0' : '340px';
    m.style.opacity = open ? '0' : '1';
  });
  m.dataset.open = open ? '0' : '1';
});

/* boot */
addEventListener('resize', layout);
layout();
kick();
</script>
